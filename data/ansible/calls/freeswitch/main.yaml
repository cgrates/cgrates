---
- name: Set up environment in order to run call tests for FreeSWITCH
  hosts: all
  roles:
    - ../../roles/freeswitch
    - ../../roles/go
    - role: ../../roles/cgrates
      vars:
        cgrates_dbs: []
        cgrates_dependencies:
          - git
          - gcc
  post_tasks:
    - name: Stop and disable packaged FreeSWITCH service
      become: true
      ansible.builtin.systemd:
        name: freeswitch
        enabled: false
        state: stopped
