---
- hosts: all
  vars:
    cgrates_dbs:
      - mysql
      - postgres
      - mongo
  pre_tasks:
    - name: Install Redis and MariaDB
      become: true
      ansible.builtin.package:
        name:
          - redis-server
          - mariadb-server
        state: present
        update_cache: true
  roles:
    - ../roles/rabbitmq
    - ../roles/nats
    - ../roles/elasticsearch
    - ../roles/kafka
    - ../roles/mongodb
    - ../roles/postgresql
    - ../roles/cgrates
