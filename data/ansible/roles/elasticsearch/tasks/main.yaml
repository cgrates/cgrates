---
- name: Install Elasticsearch dependencies
  become: true
  ansible.builtin.apt:
    name: "{{ elasticsearch_dependencies }}"
    state: present

- name: Import Elasticsearch PGP Key
  become: true
  ansible.builtin.get_url:
    url: "{{ elasticsearch_gpg_key_url }}"
    dest: "{{ elasticsearch_gpg_keyring }}"
    mode: "0644"

- name: Add Elasticsearch APT repository
  become: true
  ansible.builtin.deb822_repository:
    name: elasticsearch
    uris: "{{ elasticsearch_repository.uris }}"
    suites: "{{ elasticsearch_repository.suites }}"
    components: "{{ elasticsearch_repository.components }}"
    signed_by: "{{ elasticsearch_gpg_keyring }}"
    state: present

- name: Remove old Elasticsearch APT repository file
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/artifacts_elastic_co_packages_8_x_apt.list
    state: absent

- name: Update APT cache and install Elasticsearch
  become: true
  ansible.builtin.apt:
    name: elasticsearch
    state: present
    update_cache: true

- name: Configure Elasticsearch
  become: true
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    mode: "0644"
  notify: Restart elasticsearch

- name: Ensure elasticsearch service is in desired state
  become: true
  ansible.builtin.systemd:
    name: elasticsearch.service
    enabled: "{{ elasticsearch_service_enabled }}"
    state: "{{ elasticsearch_service_state }}"
