---
mongodb_package_name: mongodb-org
mongodb_version: 9.0
mongodb_signing_key_version: >-
  {{
    mongodb_version | int
    if mongodb_version is version('9.0', '>=')
    else mongodb_version
  }}
mongodb_service_name: mongod
mongodb_service_state: started
mongodb_service_enabled: true
mongodb_dependencies:
  - gnupg
  - curl
  - python3-debian
