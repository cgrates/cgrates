---
- name: Determine the version of MongoDB
  become: yes
  command: mongod --version
  register: mongodb_version_check
  changed_when: false
  failed_when: false

- name: Set fact for MongoDB current version
  set_fact:
    mongodb_current_version: "{{ mongodb_version_check.stdout_lines[0].split(' ')[2] if mongodb_version_check.rc == 0 else 'not installed' }}"

- name: Set fact for MongoDB installation required
  set_fact:
    mongodb_installation_required: "{{ mongodb_current_version != mongodb_version }}"

- block:
    - name: Install dependencies
      become: yes
      apt:
        name: "{{ mongodb_dependencies }}"
        state: present
        update_cache: yes

    - name: Import the MongoDB public GPG Key
      become: yes
      ansible.builtin.get_url:
        url: "https://pgp.mongodb.com/server-{{ mongodb_version }}.asc"
        dest: "/usr/share/keyrings/mongodb-server-{{ mongodb_version }}.asc"
        mode: "0644"

    - name: Add MongoDB repository for Debian
      become: yes
      ansible.builtin.deb822_repository:
        name: "{{ mongodb_package_name }}-{{ mongodb_version }}"
        uris: http://repo.mongodb.org/apt/debian
        suites: "{{ ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_version }}"
        components: main
        signed_by: "/usr/share/keyrings/mongodb-server-{{ mongodb_version }}.asc"
      when: ansible_facts['distribution'] == 'Debian'

    - name: Add MongoDB repository for Ubuntu
      become: yes
      ansible.builtin.deb822_repository:
        name: "{{ mongodb_package_name }}-{{ mongodb_version }}"
        uris: https://repo.mongodb.org/apt/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_version }}"
        components: multiverse
        architectures: [amd64, arm64]
        signed_by: "/usr/share/keyrings/mongodb-server-{{ mongodb_version }}.asc"
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Remove old MongoDB APT repository file
      become: yes
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/{{ mongodb_package_name }}-{{ mongodb_version }}.list"
        state: absent

    - name: Install MongoDB packages
      become: yes
      apt:
        name: "{{ mongodb_package_name }}"
        state: present
        update_cache: yes

    - name: Start and enable MongoDB service
      become: yes
      ansible.builtin.systemd:
        name: "{{ mongodb_service_name }}"
        state: "{{ mongodb_service_state }}"
        enabled: "{{ mongodb_service_enabled }}"

  when: mongodb_installation_required
