---
- name: Install PostgreSQL dependencies
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: yes

- name: Create the PostgreSQL repository configuration
  become: true
  ansible.builtin.deb822_repository:
    name: pgdg
    uris: '{{ postgresql_repo }}'
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    components: main
    signed_by: '{{ postgresql_key_url }}'

- name: Remove old PostgreSQL APT repository file
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pgdg.list
    state: absent

- name: Update the package lists and ensure PostgreSQL is the latest version
  become: true
  ansible.builtin.apt:
    name: '{{ postgresql_version }}'
    state: latest
    update_cache: yes

- name: Manage the PostgreSQL service
  become: true
  ansible.builtin.systemd:
    name: postgresql
    state: '{{ postgresql_service_state }}'
    enabled: '{{ postgresql_service_enabled }}'
