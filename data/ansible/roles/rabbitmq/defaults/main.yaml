rabbitmq_keys:
  - url: "https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA"
    dest: "/usr/share/keyrings/com.rabbitmq.team.asc"
rabbitmq_dependencies:
  - curl
  - gnupg
  - apt-transport-https
  - python3-debian

rabbitmq_repositories:
  - name: rabbitmq-erlang
    types: [deb, deb-src]
    uris:
      - "https://deb1.rabbitmq.com/rabbitmq-erlang/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}"
      - "https://deb2.rabbitmq.com/rabbitmq-erlang/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: amd64
    signed_by: /usr/share/keyrings/com.rabbitmq.team.asc
  - name: rabbitmq-server
    types: [deb, deb-src]
    uris:
      - "https://deb1.rabbitmq.com/rabbitmq-server/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}"
      - "https://deb2.rabbitmq.com/rabbitmq-server/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    architectures: amd64
    signed_by: /usr/share/keyrings/com.rabbitmq.team.asc

rabbitmq_erlang_dependencies:
  - erlang-base
  - erlang-asn1
  - erlang-crypto
  - erlang-eldap
  - erlang-ftp
  - erlang-inets
  - erlang-mnesia
  - erlang-os-mon
  - erlang-parsetools
  - erlang-public-key
  - erlang-runtime-tools
  - erlang-snmp
  - erlang-ssl
  - erlang-syntax-tools
  - erlang-tftp
  - erlang-tools
  - erlang-xmerl
