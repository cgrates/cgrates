[mappings]
; Our UR log will be written to /var/log/asterisk/ur-custom/Master.csv
; with the following schema.
Master.csv => ${CSV_QUOTE(${UR(clid)})},${CSV_QUOTE(${UR(src)})},${CSV_QUOTE(${UR(dst)})},${CSV_QUOTE(${UR(dcontext)})},${CSV_QUOTE(${UR(channel)})},${CSV_QUOTE(${UR(dstchannel)})},${CSV_QUOTE(${UR(lastapp)})},${CSV_QUOTE(${UR(lastdata)})},${CSV_QUOTE(${UR(start)})},${CSV_QUOTE(${UR(answer)})},${CSV_QUOTE(${UR(end)})},${CSV_QUOTE(${UR(duration)})},${CSV_QUOTE(${UR(billsec)})},${CSV_QUOTE(${UR(disposition)})},${CSV_QUOTE(${UR(amaflags)})},${CSV_QUOTE(${UR(accountcode)})},${CSV_QUOTE(${UR(uniqueid)})},${CSV_QUOTE(${UR(userfield)})},${UR(sequence)}
